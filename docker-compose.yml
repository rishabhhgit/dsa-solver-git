services:
  dsa-practice-solver:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - dsa-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dsa-data:
